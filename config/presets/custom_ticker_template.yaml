# Preset: Custom Ticker Template
# Starting point for user-defined ticker universe experiments.
# Replace the tickers list and adjust feature/label/model choices as needed.

name: custom_ticker_template
display_name: Custom Ticker Universe Template
description: >
  Template for user-defined ticker experiments. Replace the tickers list
  with your target assets. Adjust features, labels, and signals to match
  the universe structure (single-asset vs. multi-asset constraints apply).
asset_class: custom           # ref: config/registry/asset_classes.yaml
universe: custom_ticker_list  # ref: config/registry/universes.yaml (empty tickers)
frequency: monthly

# Replace this list with your target tickers.
# For multi-asset signals (top_n, long_short, normalize) use >= 5 tickers.
# For single-asset signals (sign, threshold) use exactly 1 ticker.
tickers: []

features:
  - type: momentum
    params:
      lookback: 252
  - type: rolling_volatility
    params:
      window: 21
  # Add more features from config/registry/features.yaml

labels:
  type: forward_returns         # ref: config/registry/labels.yaml
  params:
    horizon: 21

model:
  type: RidgeRegression         # ref: config/registry/models.yaml
  params:
    alpha: 1.0

signal:
  type: sign                    # ref: config/registry/signals.yaml
  # For multi-asset universes, consider: top_n, long_short, normalize

validation:
  type: rolling                 # ref: config/registry/validation.yaml
  params:
    train_months: 36
    test_months: 6
    gap_days: 0

portfolio_construction:
  weighting:
    scheme: equal_weight        # ref: config/registry/portfolio_construction.yaml
    prediction_normalization: none

transaction_cost_bps: 10
benchmark: SPY

diagnostics:
  - split_metrics

notes: >
  This is a template only. Before running:
  1. Replace tickers with your target list.
  2. Confirm signal/label compatibility with your universe size.
  3. Adjust feature parameters to match your asset class and frequency.
  4. Set an appropriate benchmark ticker.
  Resolver logic (Phase 2) will validate compatibility automatically.
