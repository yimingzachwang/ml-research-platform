name: showcase_20etfs_prices
schema_version: v1
description: >
  Canonical Research Showcase — 20-ETF daily OHLCV dataset profile.
  Downloads and registers daily adjusted-close price data for the full
  showcase_20etfs universe. Already-registered tickers will be skipped
  automatically; only new tickers (LQD, DBC, VNQ, XLV, XLI, XLP, XLU)
  require download if the extended universe data is already present.
ingestion_config: configs/data/data_agent_v1.yaml
universe: configs/universes/showcase_20etfs.yaml
date_range:
  start: "2010-01-01"
  end: "2025-12-31"
data_type: ohlcv
source: yfinance
frequency: 1d
